<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --ink: #12202C;
  --muted: #5B6B79;
  --line: #D3DAE1;
  --accent: #2E4BDB;
  --accent-ink: #FFFFFF;
  --user-bg: #12202C;
  --user-ink: #F4F7FA;
  --code-bg: #E1E7EC;
  --danger: #B4311F;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141A;
    --surface: #151D25;
    --ink: #E6ECF1;
    --muted: #8D9CAA;
    --line: #263340;
    --accent: #7C93FF;
    --accent-ink: #0E141A;
    --user-bg: #24323F;
    --user-ink: #E6ECF1;
    --code-bg: #1B252E;
    --danger: #FF8A78;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141A;
  --surface: #151D25;
  --ink: #E6ECF1;
  --muted: #8D9CAA;
  --line: #263340;
  --accent: #7C93FF;
  --accent-ink: #0E141A;
  --user-bg: #24323F;
  --user-ink: #E6ECF1;
  --code-bg: #1B252E;
  --danger: #FF8A78;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
}
.wrap { width: 100%; max-width: 760px; margin-inline: auto; }

header { flex: none; border-bottom: 1px solid var(--line); }
header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; color: var(--accent); }
.brand h1 { margin: 0; font-family: var(--font-display); font-size: 1.5rem; line-height: 1; font-weight: 700; letter-spacing: -0.02em; }
.brand span { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ghost {
  font: inherit; font-size: 0.85rem; font-weight: 500;
  background: transparent; color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 12px; cursor: pointer; white-space: nowrap;
  transition: border-color .2s, color .2s;
}
.ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.ghost:disabled { opacity: 0.45; cursor: default; }
:where(button, textarea):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scroll-behavior: smooth; }
main .wrap { padding-block: 28px; display: flex; flex-direction: column; gap: 26px; }

.hello h2 {
  margin: 0 0 10px;
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1.02; letter-spacing: -0.03em;
  text-wrap: balance; max-width: 14ch;
}
.hello p { margin: 0 0 22px; color: var(--muted); max-width: 46ch; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 0.9rem; text-align: left;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 14px; cursor: pointer;
  transition: border-color .2s, color .2s, transform .2s;
}
.chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

.msg { display: flex; flex-direction: column; gap: 6px; min-width: 0; animation: rise .35s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.msg.user { align-items: flex-end; }
.msg.user .body {
  background: var(--user-bg); color: var(--user-ink);
  border-radius: 16px 16px 4px 16px;
  padding: 10px 14px; max-width: min(85%, 560px);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.who { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.msg.eco .body { overflow-wrap: anywhere; min-width: 0; }
.body p { margin: 0 0 0.8em; }
.body p:last-child, .body ul:last-child, .body ol:last-child, .body pre:last-child { margin-bottom: 0; }
.body ul, .body ol { margin: 0 0 0.8em; padding-left: 1.3em; }
.body li { margin-bottom: 0.25em; }
.body code { font-family: var(--font-mono); font-size: 0.88em; background: var(--code-bg); border-radius: 5px; padding: 0.1em 0.38em; }
.body pre { margin: 0 0 0.8em; background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
.body pre code { background: none; padding: 0; font-size: 0.84rem; line-height: 1.6; }

.tools { display: flex; gap: 8px; align-items: center; }
.tools button { font: inherit; font-size: 0.78rem; background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px 0; transition: color .2s; }
.tools button:hover { color: var(--accent); }
.note { font-size: 0.85rem; color: var(--danger); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.note button { font: inherit; font-size: 0.82rem; font-weight: 500; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.note button:hover { border-color: var(--accent); color: var(--accent); }
.soft { font-size: 0.85rem; color: var(--muted); }

.dots { display: inline-flex; gap: 5px; padding: 8px 0; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: 0.35; animation: pulse 1.1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: 0.15s; }
.dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes pulse { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }

footer { flex: none; padding-bottom: 10px; }
footer .wrap { padding-top: 10px; }

/* Selector de versión */
.tiers {
  position: relative; display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 3px; max-width: 340px; margin: 0 auto 4px;
}
.tiers .pill {
  position: absolute; top: 3px; bottom: 3px; left: 3px;
  width: calc((100% - 6px) / 3);
  background: var(--accent); border-radius: 9px; z-index: 0;
  transition: transform .4s cubic-bezier(.3, 1.25, .5, 1);
}
.tiers button {
  position: relative; z-index: 1; background: none; border: none;
  font: inherit; font-size: 0.85rem; font-weight: 500;
  padding: 7px 4px; color: var(--muted); cursor: pointer;
  transition: color .25s;
}
.tiers button:hover { color: var(--ink); }
.tiers button[aria-checked="true"] { color: var(--accent-ink); }
.tierdesc {
  text-align: center; font-size: 0.75rem; color: var(--muted);
  margin: 0 0 8px; min-height: 1.2em; transition: opacity .2s;
}
.tierdesc.out { opacity: 0; }

form { display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 14px; transition: border-color .2s; }
form:focus-within { border-color: var(--accent); }
textarea {
  flex: 1; min-width: 0; resize: none; border: none; outline: none;
  background: transparent; color: var(--ink);
  font: inherit; line-height: 1.5; padding: 7px 0; max-height: 160px;
}
textarea::placeholder { color: var(--muted); }
textarea:focus-visible { outline: none; }
.send {
  flex: none; width: 40px; height: 40px; border: none; border-radius: 11px;
  background: var(--accent); color: var(--accent-ink); cursor: pointer;
  display: grid; place-items: center;
  transition: transform .15s, opacity .2s, background .2s;
}
.send:active:not(:disabled) { transform: scale(0.92); }
.send:disabled { opacity: 0.4; cursor: default; }
.send.stop { background: var(--ink); color: var(--bg); }
.fine { margin: 8px 4px 0; font-size: 0.75rem; color: var(--muted); text-align: center; }
[hidden]{display:none!important}

@media (prefers-reduced-motion: reduce) {
  .dots i { animation: none; opacity: 0.7; }
  .msg { animation: none; }
  .tiers .pill { transition: none; }
  main { scroll-behavior: auto; }
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <circle cx="9" cy="14" r="3.2" fill="currentColor"/>
        <path d="M15 8.2a8.2 8.2 0 0 1 0 11.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M19.6 4.6a14 14 0 0 1 0 18.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
      </svg>
      <h1>Eco</h1>
      <span id="tierLabel">Basic</span>
    </div>
    <button type="button" class="ghost" id="reset" disabled>Nueva conversación</button>
  </div>
</header>

<main id="scroll">
  <div class="wrap" id="chat">
    <section class="hello" id="hello">
      <h2>Pregúntame lo que quieras.</h2>
      <p>Escribe en español o en cualquier otro idioma. Puedo explicar, redactar, resumir, traducir o ayudarte con código.</p>
      <div class="chips" id="chips"></div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="tiers" id="tiers" role="radiogroup" aria-label="Versión de Eco">
      <span class="pill" id="pill" aria-hidden="true"></span>
      <button type="button" role="radio" data-tier="basic" aria-checked="true">Basic</button>
      <button type="button" role="radio" data-tier="medium" aria-checked="false">Medium</button>
      <button type="button" role="radio" data-tier="pro" aria-checked="false">Pro</button>
    </div>
    <p class="tierdesc" id="tierdesc"></p>
    <form id="form" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Escribe tu mensaje…" aria-label="Mensaje para Eco"></textarea>
      <button type="submit" class="send" id="send" aria-label="Enviar mensaje" disabled>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 14.5V3.5M9 3.5L4 8.5M9 3.5L14 8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <p class="fine" id="fine">Eco puede equivocarse. Comprueba los datos importantes.</p>
  </div>
</footer>

<script>
(function () {
  var RULES = "Eres Eco, un asistente de IA que vive en una página web. " +
    "Responde en el idioma que use la persona (por defecto, español). Sé claro, directo y útil, sin rodeos. " +
    "Formato permitido: párrafos cortos, listas con guiones o números, **negrita**, `código` en línea y bloques de código con ```. " +
    "No uses encabezados ni tablas. Si no sabes algo, dilo. No puedes navegar por internet ni recordar otras conversaciones.";

  var SUGGESTIONS = [
    "Explícame la relatividad como si tuviera 12 años",
    "Ayúdame a redactar un correo para pedir un día libre",
    "Escribe una función en Python que ordene una lista de diccionarios",
    "Resume en tres puntos qué es la inflación"
  ];

  var TIERS = {
    basic:  { name: "Basic",  index: 0, desc: "Rápido y ligero" },
    medium: { name: "Medium", index: 1, desc: "Equilibrado" },
    pro:    { name: "Pro",    index: 2, desc: "El más listo, algo más lento" }
  };

  var PAGE_VERSION = "web 1.2";
  var ENDPOINT = "https://eco.x-mayor.workers.dev";

  var chat = document.getElementById("chat");
  var scroller = document.getElementById("scroll");
  var hello = document.getElementById("hello");
  var chips = document.getElementById("chips");
  var form = document.getElementById("form");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var resetBtn = document.getElementById("reset");
  var fine = document.getElementById("fine");
  var tiersEl = document.getElementById("tiers");
  var pill = document.getElementById("pill");
  var tierDesc = document.getElementById("tierdesc");
  var tierLabel = document.getElementById("tierLabel");

  var sample = null;
  var turns = [];
  var busy = false;
  var ctl = null;
  var epoch = 0;
  var tier = "basic";

  var ICON_SEND = sendBtn.innerHTML;
  var ICON_STOP = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2" fill="currentColor"/></svg>';

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    return s;
  }
  function md(text) {
    var out = [];
    text.split("```").forEach(function (part, i) {
      if (i % 2 === 1) {
        var nl = part.indexOf("\n");
        var code = nl > -1 ? part.slice(nl + 1) : part;
        out.push("<pre><code>" + esc(code.replace(/\n$/, "")) + "</code></pre>");
        return;
      }
      part.split(/\n{2,}/).forEach(function (block) {
        block = block.trim();
        if (!block) return;
        var lines = block.split("\n");
        if (lines.every(function (l) { return /^\s*[-*•]\s+/.test(l); })) {
          out.push("<ul>" + lines.map(function (l) { return "<li>" + inline(l.replace(/^\s*[-*•]\s+/, "")) + "</li>"; }).join("") + "</ul>");
        } else if (lines.every(function (l) { return /^\s*\d+[.)]\s+/.test(l); })) {
          out.push("<ol>" + lines.map(function (l) { return "<li>" + inline(l.replace(/^\s*\d+[.)]\s+/, "")) + "</li>"; }).join("") + "</ol>");
        } else {
          out.push("<p>" + lines.map(inline).join("<br>") + "</p>");
        }
      });
    });
    return out.join("");
  }

  function nearBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120; }
  function toBottom() { scroller.scrollTop = scroller.scrollHeight; }

  /* Selector de versión */
  function setTier(t, save) {
    if (!TIERS[t]) t = "basic";
    tier = t;
    pill.style.transform = "translateX(" + (TIERS[t].index * 100) + "%)";
    Array.prototype.forEach.call(tiersEl.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-checked", b.getAttribute("data-tier") === t ? "true" : "false");
    });
    tierLabel.textContent = TIERS[t].name;
    tierDesc.classList.add("out");
    setTimeout(function () {
      tierDesc.textContent = TIERS[t].desc;
      tierDesc.classList.remove("out");
    }, 150);
    if (save) { try { localStorage.setItem("eco-tier", t); } catch (e) {} }
  }
  Array.prototype.forEach.call(tiersEl.querySelectorAll("button"), function (b) {
    b.addEventListener("click", function () { setTier(b.getAttribute("data-tier"), true); input.focus(); });
  });
  var saved = null;
  try { saved = localStorage.getItem("eco-tier"); } catch (e) {}
  setTier(saved, false);

  function addUser(text) {
    var m = document.createElement("div");
    m.className = "msg user";
    var b = document.createElement("div");
    b.className = "body";
    b.textContent = text;
    m.appendChild(b);
    chat.appendChild(m);
    toBottom();
  }

  function addEco() {
    var m = document.createElement("div");
    m.className = "msg eco";
    var who = document.createElement("div");
    who.className = "who";
    who.textContent = "Eco " + TIERS[tier].name;
    var b = document.createElement("div");
    b.className = "body";
    b.innerHTML = '<span class="dots" role="status" aria-label="Eco está pensando"><i></i><i></i><i></i></span>';
    m.appendChild(who);
    m.appendChild(b);
    chat.appendChild(m);
    toBottom();
    return { box: m, body: b };
  }

  function setBusy(v) {
    busy = v;
    sendBtn.innerHTML = v ? ICON_STOP : ICON_SEND;
    sendBtn.classList.toggle("stop", v);
    sendBtn.setAttribute("aria-label", v ? "Detener respuesta" : "Enviar mensaje");
    sendBtn.type = v ? "button" : "submit";
    refresh();
  }
  function refresh() {
    sendBtn.disabled = !sample || (!busy && !input.value.trim());
    resetBtn.disabled = turns.length === 0 && !busy;
  }

  function errorCopy(code) {
    switch (code) {
      case "rate_limited": return "Has alcanzado el límite de uso por ahora. Espera un momento o prueba otra versión de Eco.";
      case "refused": return "Eco no puede responder a ese mensaje. Prueba a plantearlo de otra forma.";
      case "prompt_too_large": return "La conversación es demasiado larga. Empieza una nueva.";
      default: return "No se pudo completar la respuesta. Inténtalo de nuevo.";
    }
  }

  function addCopy(eco, text) {
    var t = document.createElement("div");
    t.className = "tools";
    var c = document.createElement("button");
    c.type = "button";
    c.textContent = "Copiar";
    c.addEventListener("click", function () {
      var done = function () { c.textContent = "Copiado"; setTimeout(function () { c.textContent = "Copiar"; }, 1500); };
      var fail = function () {
        var r = document.createRange();
        r.selectNodeContents(eco.body);
        var s = window.getSelection();
        s.removeAllRanges(); s.addRange(r);
        c.textContent = "Selecciona y copia";
      };
      try { navigator.clipboard.writeText(text).then(done, fail); } catch (e) { fail(); }
    });
    t.appendChild(c);
    eco.box.appendChild(t);
  }

  function run() {
    if (busy || !sample) return;
    var myEpoch = epoch;
    var eco = addEco();
    var local = new AbortController();
    ctl = local;
    setBusy(true);

    var payload = [{ role: "user", content: RULES }].concat(turns.slice(-30));
    sample(payload, {
      cache: false,
      signal: local.signal,
      onText: function (u) {
        if (myEpoch !== epoch) return;
        var stick = nearBottom();
        eco.body.innerHTML = md(u.text);
        if (stick) toBottom();
      }
    }).then(function (res) {
      if (myEpoch !== epoch) return;
      turns.push({ role: "assistant", content: res.text });
      eco.body.innerHTML = md(res.text);
      if (res.truncated) {
        var n = document.createElement("div");
        n.className = "soft";
        n.textContent = "La respuesta se cortó por longitud. Pídeme que continúe.";
        eco.box.appendChild(n);
      }
      addCopy(eco, res.text);
    }).catch(function (e) {
      if (myEpoch !== epoch) return;
      var code = e && e.code;
      var partial = e && e.text;
      if (partial && code !== "refused") {
        eco.body.innerHTML = md(partial);
        turns.push({ role: "assistant", content: partial });
      } else {
        eco.box.remove();
      }
      if (code === "cancelled") {
        if (partial) {
          var s = document.createElement("div");
          s.className = "soft";
          s.textContent = "Respuesta detenida.";
          chat.appendChild(s);
        }
        return;
      }
      var note = document.createElement("div");
      note.className = "note";
      var msg = document.createElement("span");
      msg.textContent = errorCopy(code) + (e && e.detail ? " [" + e.detail + "]" : "");
      note.appendChild(msg);
      if (code !== "prompt_too_large") {
        var rb = document.createElement("button");
        rb.type = "button";
        rb.textContent = "Reintentar";
        rb.addEventListener("click", function () {
          note.remove();
          if (turns.length && turns[turns.length - 1].role === "assistant") turns.push({ role: "user", content: "Continúa." });
          run();
        });
        note.appendChild(rb);
      }
      chat.appendChild(note);
      toBottom();
    }).then(function () {
      if (myEpoch !== epoch) return;
      ctl = null;
      setBusy(false);
      input.focus();
    });
  }

  function send(text) {
    text = (text || "").trim();
    if (!text || busy || !sample) return;
    hello.hidden = true;
    turns.push({ role: "user", content: text });
    addUser(text);
    input.value = "";
    grow();
    run();
  }

  function grow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
    refresh();
  }

  function reset() {
    epoch++;
    if (ctl) { try { ctl.abort(); } catch (e) {} ctl = null; }
    turns = [];
    busy = false;
    sendBtn.innerHTML = ICON_SEND;
    sendBtn.classList.remove("stop");
    sendBtn.type = "submit";
    Array.prototype.slice.call(chat.children).forEach(function (n) { if (n !== hello) n.remove(); });
    hello.hidden = false;
    input.value = "";
    grow();
    input.focus();
  }

  SUGGESTIONS.forEach(function (s) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = s;
    b.addEventListener("click", function () { send(s); });
    chips.appendChild(b);
  });

  form.addEventListener("submit", function (e) { e.preventDefault(); send(input.value); });
  sendBtn.addEventListener("click", function () { if (busy && ctl) ctl.abort(); });
  input.addEventListener("input", grow);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
  });
  resetBtn.addEventListener("click", reset);

  /* Efecto de escritura progresiva */
  var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function reveal(text, onText, signal) {
    return new Promise(function (resolve, reject) {
      if (REDUCED) { onText({ text: text }); resolve(); return; }
      var i = 0;
      var step = Math.max(2, Math.ceil(text.length / 160));
      function tick() {
        if (signal && signal.aborted) { reject({ code: "cancelled", text: text.slice(0, i) }); return; }
        i = Math.min(text.length, i + step);
        onText({ text: text.slice(0, i) });
        if (i >= text.length) resolve(); else setTimeout(tick, 16);
      }
      tick();
    });
  }

  sample = function (payload, opts) {
    return fetch(ENDPOINT, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ tier: tier, system: payload[0].content, messages: payload.slice(1) }),
      signal: opts.signal
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (d.version) fine.textContent = "Eco puede equivocarse. Comprueba los datos importantes. · " + PAGE_VERSION + " · " + d.version + (d.model ? " · " + d.model : "");
        if (!r.ok || !d.text) {
          throw {
            code: r.status === 429 ? "rate_limited" : "upstream_error",
            detail: ("HTTP " + r.status + (d.error ? " " + d.error : "") + (d.detail ? ": " + d.detail : "")).slice(0, 300)
          };
        }
        return reveal(d.text, opts.onText || function () {}, opts.signal).then(function () {
          return { text: d.text, truncated: !!d.truncated };
        });
      });
    }, function (err) {
      throw {
        code: err && err.name === "AbortError" ? "cancelled" : "upstream_error",
        detail: err && err.name !== "AbortError" ? "Sin conexión con el Worker: " + (err.message || err) : ""
      };
    });
  };
  refresh();
})();
</script>
